<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mundial 2026 - Estadios</title>

<style>
html, body{
  margin:0;
  padding:0;
  width:100%;
  overflow-x:hidden;
  background:#fff;
}

/* contenedor */
.widget-container{
  width:100%;
}

/* widget */
.df-widgets{
  width:100%;
}

/* OCULTAR PUBLICIDAD Y BRANDING */
.df-widgets .panel-banner1,
.df-widgets .branding,
.df-widgets [class*="advertising"],
.df-widgets [class*="banner"]{
  display:none !important;
}

/* quitar espacio vacío si queda margen */
.df-widgets{
  padding-top:0 !important;
  margin-top:0 !important;
}
</style>
</head>

<body>

<div class="widget-container">
  <div
    class="df-widgets"
    data-component="stadiums-widget"
    data-theme="fifa-classic"
    data-variant="light"
    data-lang="es">
  </div>
</div>

<script src="https://1407747097.rsc.cdn77.org/worldcup/latest/df-draw-widget.iife.js"></script>

</body>
</html>
